# CI for rewrite/ — the fully-owned reimplementation.  The predecessor at the
# repository root is not built here; it is a frozen test oracle (rewrite/ORACLE.md)
# and its numbers live in rewrite/oracle/cases.tsv.
#
# The shape of this workflow is the point of plan L0 step 4: FETCHING AND GATING
# ARE SEPARATE JOBS.  The gates run with the cache restored and are expected to
# pass with no network, so a green tick means the pinned bytes are the bytes —
# not that a download happened to succeed today.
#
# One thing a green tick here does NOT cover, on purpose: the literature.  A literature
# entry is a provenance record that no build input and no test reads (plan §5 constraint 3,
# a checked property), and the hosts of several refuse GitHub's runners, so this workflow
# neither fetches nor verifies literature (`--skip-literature`, here and in tools/ci.sh) and
# says how many entries it left.  tools/ci.sh run WITHOUT the flag, on a machine that has
# them, verifies everything (PROVENANCE.md section 41.7).

name: rewrite

on:
  push:
    paths: ['rewrite/**', '.github/workflows/rewrite-ci.yml']
  pull_request:
    paths: ['rewrite/**', '.github/workflows/rewrite-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: rewrite

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-13 cmake
        working-directory: .

      # The cache key is the manifest's own hash.  Change a pin and the cache
      # misses, which is correct: a different manifest is a different input set.
      # The cache holds data/cache, where the fetcher puts every code and data entry it downloads.
      # It does NOT hold data/literature, and nothing here fetches or verifies literature: group C1b
      # (2026-10-06) cached it too, because every run that hit the cache had found nothing for `verify`
      # there and failed on its first gate from 2026-09-18, and the first run past that showed the other
      # half -- CelesTrak and the UNT library never answer a GitHub runner, five literature entries of the
      # six the fetch could not get -- so literature leaves this workflow (`--skip-literature` below), and
      # the cache step is again unconditional: nothing it holds is anything a fork could not fetch itself,
      # and `verify` checks every byte it restores against the manifest (PROVENANCE.md section 41.7).
      - name: Restore the manifest cache
        id: cache
        uses: actions/cache@v4
        with:
          path: rewrite/data/cache
          key: manifest-${{ hashFiles('rewrite/manifest/manifest.json') }}

      # The ONLY step permitted to touch the network, and only on a cache miss.  The tool is C++ (tools/fetch.cpp): compiled first, by the helper
      # ci.sh uses, with the compiler the gates will use, into the directory ci.sh will find it built in.
      #
      # `--keep-going`: the run does not stop at the first entry that fails, so ONE run lists every entry that cannot be fetched (an origin refusing
      # a GitHub runner is found with a drifted pin, not behind it).  `fetch` skips what is already cached and hash-correct, so running it again
      # retries exactly what failed: a dropped connection (exit 4; some origins drop many) is retried, twice more, a minute apart; anything else, a
      # HASH MISMATCH (exit 2) above all, is final.  The exit code is the FIRST failure's, in manifest order.
      #
      # `--skip-literature`: the literature entries are not fetched (see the cache step above; the tool says how many it left).
      #
      # `timeout-minutes` is the backstop under the 30-second connect timeout of tools/fetch.cpp.  A host that refuses the runner now costs one entry 170 s a
      # pass where it cost 620, but a host with many entries would still cost hours.  Its number is a MEASUREMENT (read from the log of run 37465937705, 2026-10-06):
      # that run spent 65 min 11 s in this step (12:48:54Z to 13:54:05Z) and stopped after its first pass; about 60 of those minutes were the six entries no
      # runner could reach (5 attempts x 120 s each), and the ~107 good downloads took about 5.  With literature skipped and Vallado vendored, a cache-miss pass
      # should take about 5 minutes, so 20 is four times the measured real time.  A step that reaches it has found a host that refuses us, which is the finding
      # (PROVENANCE.md section 41.7).
      - name: Populate the cache from origin
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        env:
          CXX: g++-13
        run: |
          cmake -DODL_HOST_OUT=build-ci/host -DODL_CXX="$CXX" -P cmake/OdlBuildHostTool.cmake
          for attempt in 1 2 3; do
            status=0
            build-ci/host/fetch fetch --keep-going --skip-literature || status=$?
            [ "$status" -eq 4 ] || exit "$status"
            [ "$attempt" -lt 3 ] && sleep 60
          done
          exit 4

      # Everything below is offline by construction; ci.sh poisons the proxies
      # so that anything reaching for the network fails instead of succeeding.
      # `--skip-literature`: gate 1, the configure, the ctest verify and the reproducibility gate leave the
      # literature entries alone, and the log says how many (and the last line says the run did not cover them).
      - name: Run every gate, offline
        env:
          CXX: g++-13
        run: tools/ci.sh --prove-offline --skip-literature
