# CI for rewrite/ — the fully-owned reimplementation.  The predecessor at the
# repository root is not built here; it is a frozen test oracle (rewrite/ORACLE.md)
# and its numbers live in rewrite/oracle/cases.tsv.
#
# The shape of this workflow is the point of plan L0 step 4: FETCHING AND GATING
# ARE SEPARATE JOBS.  The gates run with the cache restored and are expected to
# pass with no network, so a green tick means the pinned bytes are the bytes —
# not that a download happened to succeed today.

name: rewrite

on:
  push:
    paths: ['rewrite/**', '.github/workflows/rewrite-ci.yml']
  pull_request:
    paths: ['rewrite/**', '.github/workflows/rewrite-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: rewrite

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-13 cmake
        working-directory: .

      # The cache key is the manifest's own hash.  Change a pin and the cache
      # misses, which is correct: a different manifest is a different input set.
      # The cache holds BOTH places the fetcher writes: data/cache, and data/literature
      # (the pinned papers and standards).  The first version of this workflow cached only
      # the first, so every run that hit the cache found nothing for `verify` in the second
      # and failed on its first gate, from 2026-09-18 16:14 UTC (PROVENANCE.md section 41).
      #
      # Not for a pull request from a fork.  Its workflow runs code the repository's owner has not reviewed, and could read what the cache holds,
      # the literature PDFs among it; such a run misses, fetches from origin and saves nothing.
      - name: Restore the manifest cache
        id: cache
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache@v4
        with:
          path: |
            rewrite/data/cache
            rewrite/data/literature
          key: manifest-${{ hashFiles('rewrite/manifest/manifest.json') }}

      # The ONLY step permitted to touch the network, and only on a cache miss.  The tool is C++ (tools/fetch.cpp): compiled first, by the helper
      # ci.sh uses, with the compiler the gates will use, into the directory ci.sh will find it built in.
      #
      # `--keep-going`: the run does not stop at the first entry that fails, so ONE run lists every entry that cannot be fetched (an origin refusing
      # a GitHub runner is found with a drifted pin, not behind it).  `fetch` skips what is already cached and hash-correct, so running it again
      # retries exactly what failed: a dropped connection (exit 4; some origins drop many) is retried, twice more, a minute apart; anything else, a
      # HASH MISMATCH (exit 2) above all, is final.  The exit code is the FIRST failure's, in manifest order.
      - name: Populate the cache from origin
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CXX: g++-13
        run: |
          cmake -DODL_HOST_OUT=build-ci/host -DODL_CXX="$CXX" -P cmake/OdlBuildHostTool.cmake
          for attempt in 1 2 3; do
            status=0
            build-ci/host/fetch fetch --keep-going || status=$?
            [ "$status" -eq 4 ] || exit "$status"
            [ "$attempt" -lt 3 ] && sleep 60
          done
          exit 4

      # Everything below is offline by construction; ci.sh poisons the proxies
      # so that anything reaching for the network fails instead of succeeding.
      - name: Run every gate, offline
        env:
          CXX: g++-13
        run: tools/ci.sh --prove-offline
